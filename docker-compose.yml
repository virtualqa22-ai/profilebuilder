version: '3.8'

services:
  # Microservices
  user-management:
    build: ./services/user-management
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://user_mongo:27017/user_management_db
      - PORT=3001
    depends_on:
      - user_mongo
    restart: unless-stopped

  resume-management:
    build: ./services/resume-management
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://resume_mongo:27017/resume_management_db
      - PORT=3002
    depends_on:
      - resume_mongo
    restart: unless-stopped

  ai-processing:
    build: ./services/ai-processing
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://ai_mongo:27017/ai_processing_db
      - PORT=3003
    depends_on:
      - ai_mongo
    restart: unless-stopped

  document-generation:
    build: ./services/document-generation
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://doc_mongo:27017/document_generation_db
      - PORT=3004
    depends_on:
      - doc_mongo
    restart: unless-stopped

  file-upload:
    build: ./services/file-upload
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://file_mongo:27017/file_upload_db
      - PORT=3005
    depends_on:
      - file_mongo
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  # Databases for microservices
  user_mongo:
    image: mongo:7.0
    environment:
      - MONGO_INITDB_DATABASE=user_management_db
    volumes:
      - user_mongo_data:/data/db
    restart: unless-stopped

  resume_mongo:
    image: mongo:7.0
    environment:
      - MONGO_INITDB_DATABASE=resume_management_db
    volumes:
      - resume_mongo_data:/data/db
    restart: unless-stopped

  ai_mongo:
    image: mongo:7.0
    environment:
      - MONGO_INITDB_DATABASE=ai_processing_db
    volumes:
      - ai_mongo_data:/data/db
    restart: unless-stopped

  doc_mongo:
    image: mongo:7.0
    environment:
      - MONGO_INITDB_DATABASE=document_generation_db
    volumes:
      - doc_mongo_data:/data/db
    restart: unless-stopped

  file_mongo:
    image: mongo:7.0
    environment:
      - MONGO_INITDB_DATABASE=file_upload_db
    volumes:
      - file_mongo_data:/data/db
    restart: unless-stopped

  # Legacy services (for migration)
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/profilebuilder
    depends_on:
      - mongo
    volumes:
      - ./frontend/public/uploads:/app/public/uploads
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=profilebuilder
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  user_mongo_data:
  resume_mongo_data:
  ai_mongo_data:
  doc_mongo_data:
  file_mongo_data:
  mongo_data:
  redis_data: