name: Dependency Health Monitoring

on:
  schedule:
    # Run weekly on Mondays at 8 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  dependency-health-check:
    name: Dependency Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run comprehensive dependency audit
        id: audit
        run: |
          echo "Running dependency health check..."
          npm run deps:health > health-report.json
          cat health-report.json

      - name: Check for critical vulnerabilities
        id: critical-check
        run: |
          CRITICAL=$(jq '.critical // 0' health-report.json)
          HIGH=$(jq '.high // 0' health-report.json)
          TOTAL=$(jq '.total // 0' health-report.json)

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          echo "Found $TOTAL vulnerabilities ($CRITICAL critical, $HIGH high)"

      - name: Generate dependency report
        id: report
        run: |
          echo "## 📊 Weekly Dependency Health Report" > report.md
          echo "" >> report.md
          echo "### Vulnerability Summary" >> report.md
          echo "- **Total vulnerabilities:** $(jq '.total // 0' health-report.json)" >> report.md
          echo "- **Critical:** $(jq '.critical // 0' health-report.json)" >> report.md
          echo "- **High:** $(jq '.high // 0' health-report.json)" >> report.md
          echo "- **Moderate:** $(jq '.moderate // 0' health-report.json)" >> report.md
          echo "- **Low:** $(jq '.low // 0' health-report.json)" >> report.md
          echo "" >> report.md

          echo "### Outdated Packages" >> report.md
          npm outdated --json > outdated.json 2>/dev/null || echo "{}" > outdated.json
          OUTDATED_COUNT=$(jq 'length' outdated.json)
          echo "- **Outdated packages:** $OUTDATED_COUNT" >> report.md

          if [ "$OUTDATED_COUNT" -gt 0 ]; then
            echo "" >> report.md
            echo "#### Top 10 Outdated Packages:" >> report.md
            jq -r 'to_entries | sort_by(.value.latest) | reverse | .[0:10][] | "- `\(.key)`: \(.value.current) → \(.value.latest)"' outdated.json >> report.md
          fi

          echo "" >> report.md
          echo "### Actions Required" >> report.md

          if [ "$(jq '.critical // 0' health-report.json)" -gt 0 ]; then
            echo "🚨 **CRITICAL:** Immediate action required for critical vulnerabilities" >> report.md
          elif [ "$(jq '.high // 0' health-report.json)" -gt 0 ]; then
            echo "⚠️ **HIGH:** Review high-severity vulnerabilities" >> report.md
          else
            echo "✅ **GOOD:** No critical or high vulnerabilities found" >> report.md
          fi

          cat report.md

      - name: Create GitHub issue for critical vulnerabilities
        if: steps.critical-check.outputs.critical > 0
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['security', 'dependencies', 'critical'],
              state: 'open'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('Critical Dependency Vulnerabilities')
            );

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Critical Dependency Vulnerabilities Detected',
                body: report + '\n\n## Immediate Actions Required\n\n1. Review the vulnerabilities listed above\n2. Update affected dependencies\n3. Test thoroughly after updates\n4. Deploy security patches\n\n/cc @your-team-security',
                labels: ['security', 'dependencies', 'critical', 'urgent']
              });
            } else {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: '## 🔄 Updated Report\n\n' + report
              });
            }

      - name: Create GitHub issue for high vulnerabilities
        if: steps.critical-check.outputs.critical == 0 && steps.critical-check.outputs.high > 0
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['security', 'dependencies', 'high'],
              state: 'open'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('High Dependency Vulnerabilities')
            );

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ High Dependency Vulnerabilities Detected',
                body: report + '\n\n## Recommended Actions\n\n1. Review the vulnerabilities listed above\n2. Plan dependency updates\n3. Schedule updates during maintenance windows\n4. Test thoroughly after updates\n\n/cc @your-team-maintainers',
                labels: ['security', 'dependencies', 'high', 'maintenance']
              });
            }

      - name: Send Slack notification (optional)
        if: steps.critical-check.outputs.critical > 0
        run: |
          # Add your Slack webhook URL to repository secrets as SLACK_WEBHOOK
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"🚨 Critical dependency vulnerabilities detected in ${{ github.repository }} - $(jq '.critical // 0' health-report.json) critical, $(jq '.high // 0' health-report.json) high\"}" \
              ${{ secrets.SLACK_WEBHOOK }}
          fi

      - name: Upload health report as artifact
        uses: actions/upload-artifact@v3
        with:
          name: dependency-health-report
          path: |
            health-report.json
            report.md
            outdated.json
          retention-days: 30

  # Additional monitoring for license compliance
  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for incompatible licenses
        run: |
          echo "Checking for license compatibility..."
          npm ls --depth=0 --json | jq -r '.dependencies | to_entries[] | select(.value.license == null or (.value.license | test("GPL|LGPL|MS-PL|BSD-4-Clause|CC-BY-NC"))) | "\(.key): \(.value.license // "unknown")"' > incompatible-licenses.txt

          if [ -s incompatible-licenses.txt ]; then
            echo "⚠️ Potentially incompatible licenses found:"
            cat incompatible-licenses.txt
            echo "incompatible=true" >> $GITHUB_OUTPUT
          else
            echo "✅ All licenses appear compatible"
            echo "incompatible=false" >> $GITHUB_OUTPUT
          fi
        id: license-check

      - name: Create issue for license concerns
        if: steps.license-check.outputs.incompatible == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const licenses = fs.readFileSync('incompatible-licenses.txt', 'utf8');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚖️ License Compatibility Review Required',
              body: `## License Compatibility Issues Detected\n\nThe following dependencies may have incompatible licenses:\n\n\`\`\`\n${licenses}\n\`\`\`\n\nPlease review these licenses and ensure compliance with your project's license requirements.`,
              labels: ['license', 'compliance', 'review-required']
            });