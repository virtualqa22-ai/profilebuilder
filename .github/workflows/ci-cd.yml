name: CI/CD Pipeline with Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  # Security and Quality Checks
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Dependency vulnerability scanning
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: false

      # OWASP Dependency Check
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'ProfileBuilder'
          path: '.'
          format: 'ALL'
          args: >
            --enableRetired
            --enableExperimental
            --nvdValidForHours 24

      # Upload dependency check results
      - name: Upload dependency check results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: dependency-check-report
          path: reports/

      # CodeQL Security Analysis
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

      # Trivy vulnerability scanner for container images
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Code Quality and Testing
  quality-check:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint code
      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      # Type checking
      - name: Run TypeScript check
        run: npm run type-check
        continue-on-error: false

      # Run tests with coverage
      - name: Run tests
        run: npm run test:coverage
        continue-on-error: false

      # Upload coverage reports
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  # Build and Deploy (only on main branch)
  build-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [security-scan, quality-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build application
      - name: Build application
        run: npm run build

      # Security scan of build artifacts
      - name: Scan build artifacts
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './.next'
          format: 'sarif'
          output: 'build-scan.sarif'

      - name: Upload build scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'build-scan.sarif'

      # Deploy to staging/production (placeholder)
      - name: Deploy to staging
        run: echo "Deploy to staging environment"
        # Add actual deployment commands here

  # Security Monitoring and Alerts
  security-alerts:
    name: Security Alerts
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: always()
    steps:
      - name: Check for critical vulnerabilities
        run: |
          # Check if there are critical or high severity vulnerabilities
          if [ -f reports/dependency-check-report.html ]; then
            echo "Security scan completed. Check reports for details."
          fi

      - name: Send security notifications
        if: failure()
        run: |
          echo "Security scan failed or found critical issues"
          # Add notification logic here (Slack, email, etc.)