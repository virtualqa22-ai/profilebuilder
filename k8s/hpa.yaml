apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: profilebuilder-hpa
  labels:
    app: profilebuilder
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: profilebuilder-app
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
