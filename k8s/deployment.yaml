apiVersion: apps/v1
kind: Deployment
metadata:
 name: file-upload-deployment
 labels:
   app: file-upload
spec:
 replicas: 2
 selector:
   matchLabels:
     app: file-upload
 template:
   metadata:
     labels:
       app: file-upload
     annotations:
       sidecar.istio.io/inject: "true"
   spec:
     containers:
     - name: file-upload
       image: file-upload:latest
       ports:
       - containerPort: 3005
       env:
       - name: NODE_ENV
         value: "production"
       - name: MONGO_URI
         valueFrom:
           secretKeyRef:
             name: profilebuilder-secrets
             key: mongo-uri
       - name: PORT
         value: "3005"
       volumeMounts:
       - name: uploads-volume
         mountPath: /app/uploads
       resources:
         requests:
           memory: "256Mi"
           cpu: "200m"
         limits:
           memory: "512Mi"
           cpu: "500m"
       livenessProbe:
         httpGet:
           path: /health
           port: 3005
         initialDelaySeconds: 30
         periodSeconds: 10
       readinessProbe:
         httpGet:
           path: /health
           port: 3005
         initialDelaySeconds: 5
         periodSeconds: 5
     volumes:
     - name: uploads-volume
       persistentVolumeClaim:
         claimName: uploads-pvc