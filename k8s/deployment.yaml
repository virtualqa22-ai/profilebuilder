apiVersion: apps/v1
kind: Deployment
metadata:
  name: profilebuilder-app
  labels:
    app: profilebuilder
spec:
  replicas: 3
  selector:
    matchLabels:
      app: profilebuilder
  template:
    metadata:
      labels:
        app: profilebuilder
    spec:
      containers:
      - name: profilebuilder
        image: profilebuilder:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: profilebuilder-secrets
              key: mongodb-uri
        # Database connection pooling configuration for optimized performance
        - name: MONGODB_MAX_POOL_SIZE
          value: "20"
        - name: MONGODB_MIN_POOL_SIZE
          value: "5"
        - name: MONGODB_MAX_IDLE_TIME_MS
          value: "30000"
        - name: MONGODB_SERVER_SELECTION_TIMEOUT_MS
          value: "5000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
 name: user-management-deployment
 labels:
   app: user-management
spec:
 replicas: 2
 selector:
   matchLabels:
     app: user-management
 template:
   metadata:
     labels:
       app: user-management
     annotations:
       sidecar.istio.io/inject: "true"
   spec:
     containers:
     - name: user-management
       image: user-management:latest
       ports:
       - containerPort: 3001
       env:
       - name: NODE_ENV
         value: "production"
       - name: MONGO_URI
         valueFrom:
           secretKeyRef:
             name: profilebuilder-secrets
             key: mongo-uri
       - name: PORT
         value: "3001"
       resources:
         requests:
           memory: "256Mi"
           cpu: "200m"
         limits:
           memory: "512Mi"
           cpu: "500m"
       livenessProbe:
         httpGet:
           path: /health
           port: 3001
         initialDelaySeconds: 30
         periodSeconds: 10
       readinessProbe:
         httpGet:
           path: /health
           port: 3001
         initialDelaySeconds: 5
         periodSeconds: 5
---
