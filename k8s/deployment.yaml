apiVersion: apps/v1
kind: Deployment
metadata:
  name: profilebuilder-app
  labels:
    app: profilebuilder
spec:
  replicas: 3
  selector:
    matchLabels:
      app: profilebuilder
  template:
    metadata:
      labels:
        app: profilebuilder
    spec:
      containers:
      - name: profilebuilder
        image: profilebuilder:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: profilebuilder-secrets
              key: mongodb-uri
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5